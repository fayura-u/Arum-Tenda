name: Supabase Database Keep-Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pukul 08:00 WIB (01:00 UTC)
    - cron: '0 1 */3 * *'
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol "Run workflow" di tab GitHub Actions

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Endpoint
        run: |
          TARGET_URL="${{ secrets.SITE_URL || 'https://arumtenda.com' }}/api/cron/keep-alive"
          echo "Memulai ping keep-alive ke: $TARGET_URL"
          
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$TARGET_URL")
          else
            RESPONSE=$(curl -s -w "\n%{http_code}" "$TARGET_URL")
          fi
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          echo "Status Code: $HTTP_CODE"
          echo "Respons: $HTTP_BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ Ping berhasil! Database Supabase tetap aktif dan segar."
          else
            echo "✕ Ping gagal dengan kode HTTP $HTTP_CODE"
            exit 1
          fi
